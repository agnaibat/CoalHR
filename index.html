<!DOCTYPE html>
<html lang="ru"> 
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Голосование сотрудников</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E1E3D; --navy2:#173464; --blue:#2F55A4; --blueDark:#22417F; --blueSoft:#E9EFFA;
    --cyan:#5BB3CE; --cyanSoft:#E4F2F8; --yellow:#F2C744; --yellowDark:#B58A0A; --yellowSoft:#FCF4D6;
    --bg:#F1F5FA; --panel:#FFFFFF; --ink:#12203A; --inkSoft:#5C6B82; --line:#DFE6F1; --warn:#C0392B;
    --radius:18px;
    --shadow:0 1px 2px rgba(14,30,61,.05), 0 10px 28px rgba(14,30,61,.07);
    --head:'Montserrat','Segoe UI',Arial,sans-serif;
    --sans:'Inter','Segoe UI',-apple-system,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{ min-height:100vh; color:var(--ink); background:var(--bg); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  #app{ min-height:100vh; }

  /* ---------- фон-сцена (вход, статусы) ---------- */
  .stage{
    position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px; overflow:hidden;
    background:radial-gradient(1000px 600px at 15% 10%, var(--navy2) 0%, rgba(23,52,100,0) 60%), var(--navy);
  }
  .arcs{ position:absolute; inset:0; pointer-events:none; }
  .arcs svg{ width:100%; height:100%; display:block; }
  .stage > *:not(.arcs){ position:relative; z-index:1; }
  .foot{ margin-top:26px; font-size:12px; letter-spacing:.08em; color:rgba(255,255,255,.55); text-align:center; }

  .card{
    width:100%; max-width:440px; background:var(--panel); border-radius:24px; padding:40px 36px 36px;
    box-shadow:0 30px 70px rgba(0,0,0,.35); position:relative;
  }
  .card::before{
    content:""; position:absolute; left:36px; right:36px; top:0; height:5px; border-radius:0 0 6px 6px;
    background:linear-gradient(90deg,var(--blue),var(--cyan) 60%,var(--yellow));
  }
  .logo-lg{ display:block; width:200px; margin:0 auto 26px; }
  .card.center-card{ text-align:center; }

  .eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--blue); }
  .eyebrow::before{ content:""; width:18px; height:3px; background:var(--yellow); border-radius:3px; }
  .eyebrow.light{ color:var(--cyan); }
  h1{ font-family:var(--head); font-weight:800; font-size:28px; line-height:1.2; margin:10px 0 8px; letter-spacing:-.01em; }
  p.sub{ color:var(--inkSoft); font-size:15px; line-height:1.55; margin:0; }

  label.field{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--inkSoft); margin:24px 0 8px; text-align:left; }
  input[type=text],input[type=password]{
    width:100%; padding:14px 16px; font-size:16px; font-family:var(--sans); color:var(--ink);
    border:1.5px solid var(--line); border-radius:12px; background:#F8FAFD; outline:none; transition:.15s;
  }
  input:focus{ border-color:var(--blue); background:#fff; box-shadow:0 0 0 4px rgba(47,85,164,.14); }

  .btn{
    font-family:var(--head); font-size:14.5px; font-weight:700; letter-spacing:.01em; padding:15px 24px; border-radius:12px;
    border:1.5px solid transparent; cursor:pointer; width:100%; color:#fff; margin-top:16px; transition:.15s;
    background:linear-gradient(135deg,var(--blue),#3A69C2);
  }
  .btn:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 10px 22px rgba(47,85,164,.35); background:linear-gradient(135deg,var(--blueDark),var(--blue)); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.ghost{ background:#fff; color:var(--ink); border-color:var(--line); }
  .btn.ghost:hover:not(:disabled){ border-color:var(--blue); color:var(--blue); box-shadow:none; background:#fff; }
  .btn.danger{ color:var(--warn); }
  .btn.danger:hover:not(:disabled){ border-color:var(--warn); color:var(--warn); }
  .err{ color:var(--warn); font-size:13.5px; font-weight:500; margin-top:12px; text-align:left; line-height:1.4; }
  .link{ font-size:13px; color:var(--inkSoft); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .link:hover{ color:var(--blue); }
  .center-text{ text-align:center; margin-top:24px; }

  /* ---------- верхняя панель и «шапка» ---------- */
  .topbar{ position:sticky; top:0; z-index:30; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .topbar-in{ max-width:1120px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .logo-sm{ height:46px; display:block; }
  .chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border-radius:999px; background:var(--blueSoft); font-size:13px; color:var(--inkSoft); max-width:60%; }
  .chip b{ color:var(--navy); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip i{ font-style:normal; white-space:nowrap; }
  .chip .dot{ width:8px; height:8px; border-radius:50%; background:var(--yellow); box-shadow:0 0 0 3px rgba(242,199,68,.3); flex-shrink:0; }

  .hero{
    position:relative; overflow:hidden; color:#fff; padding:52px 20px 110px;
    background:radial-gradient(900px 400px at 85% -20%, var(--navy2) 0%, rgba(23,52,100,0) 70%), var(--navy);
  }
  .hero.compact{ padding:40px 20px 96px; }
  .hero-in{ position:relative; z-index:1; max-width:1120px; margin:0 auto; }
  .hero h1{ font-size:38px; color:#fff; margin:12px 0 10px; }
  .hero p{ margin:0; color:rgba(255,255,255,.75); font-size:16px; max-width:640px; line-height:1.55; }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 20px 120px; }
  .wrap.up{ margin-top:-62px; position:relative; z-index:2; }

  /* ---------- аватар ---------- */
  .av{ position:relative; overflow:hidden; background:linear-gradient(135deg,#D3E6F2,#8FBAD6); flex-shrink:0; }
  .av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .av .ini{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--head); font-weight:800; color:#fff; letter-spacing:.04em; text-shadow:0 2px 10px rgba(14,30,61,.4); }
  .av.big{ aspect-ratio:5/6; width:100%; }
  .av.big img{ object-position:center 20%; }
  .av.big .ini{ font-size:58px; }
  .av.sm{ width:44px; height:44px; border-radius:50%; }
  .av.sm .ini{ font-size:15px; }
  .av.md{ width:88px; height:88px; border-radius:22px; }
  .av.md .ini{ font-size:30px; }

  /* ---------- карточки кандидатов ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:22px; }
  .cand{
    position:relative; background:#fff; border:2px solid transparent; border-radius:var(--radius); overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s, border-color .2s;
  }
  .cand:hover{ transform:translateY(-5px); box-shadow:0 18px 40px rgba(14,30,61,.16); }
  .cand.active{ border-color:var(--blue); box-shadow:0 0 0 4px rgba(47,85,164,.18), 0 18px 40px rgba(14,30,61,.16); }
  .cand .check{ position:absolute; top:14px; right:14px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.92); border:2px solid #fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.18); transition:.2s; z-index:2; }
  .cand .check svg{ width:18px; height:18px; stroke:var(--navy); opacity:0; transform:scale(.5); transition:.2s; }
  .cand.active .check{ background:var(--yellow); border-color:var(--yellow); }
  .cand.active .check svg{ opacity:1; transform:scale(1); }
  .cand::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:linear-gradient(90deg,var(--blue),var(--cyan),var(--yellow)); opacity:0; transition:.2s; }
  .cand.active::after, .cand:hover::after{ opacity:1; }
  .cand-body{ padding:20px 20px 24px; display:flex; flex-direction:column; gap:12px; flex:1; }
  .cand-name{ font-family:var(--head); font-size:18px; font-weight:700; line-height:1.3; margin:0; color:var(--navy); }
  .cand-pos{ display:inline-block; align-self:flex-start; font-size:12px; font-weight:600; color:var(--blueDark); background:var(--blueSoft); padding:6px 11px; border-radius:8px; }
  .cand-sub{ display:flex; align-items:center; gap:10px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--yellowDark); margin-top:4px; }
  .cand-sub::after{ content:""; flex:1; height:1px; background:var(--line); }
  .ach{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .ach li{ position:relative; padding-left:24px; font-size:14px; line-height:1.45; color:#34445E; }
  .ach li::before{ content:""; position:absolute; left:0; top:5px; width:12px; height:8px; border-radius:50%; background:var(--yellow); transform:rotate(-20deg); box-shadow:0 2px 0 var(--cyan); }

  .bar-fixed{ position:fixed; left:0; right:0; bottom:0; z-index:20; padding:14px 20px; background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); box-shadow:0 -8px 30px rgba(14,30,61,.08); }
  .bar-inner{ max-width:1120px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .bar-sel{ font-size:13px; color:var(--inkSoft); min-width:0; }
  .bar-sel b{ display:block; color:var(--navy); font-family:var(--head); font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .bar-inner .btn{ width:auto; margin:0; padding:14px 32px; white-space:nowrap; }

  /* ---------- модальное окно ---------- */
  .overlay{ position:fixed; inset:0; z-index:50; background:rgba(8,16,33,.62); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px; animation:fade .18s; }
  .modal{ background:#fff; border-radius:24px; padding:34px 32px 30px; max-width:420px; width:100%; box-shadow:0 30px 70px rgba(0,0,0,.35); text-align:center; animation:pop .2s; }
  .modal .av{ margin:0 auto 18px; }
  .modal h2{ font-family:var(--head); font-weight:800; font-size:22px; margin:0 0 6px; color:var(--navy); }
  .modal p{ margin:0 0 6px; color:var(--inkSoft); font-size:14.5px; line-height:1.5; }
  .modal .row{ display:flex; gap:10px; margin-top:22px; }
  .modal .row .btn{ margin-top:0; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  @keyframes pop{ from{opacity:0; transform:translateY(10px) scale(.97)} to{opacity:1; transform:none} }

  /* ---------- статусы ---------- */
  .status-card .av{ margin:0 auto 20px; }
  .status-icon{ width:68px; height:68px; border-radius:50%; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; }
  .status-icon.ok{ background:var(--cyanSoft); }
  .status-icon.info{ background:var(--yellowSoft); }
  .status-icon svg{ width:32px; height:32px; }
  .status-card h1{ font-size:25px; }

  /* ---------- статистика ---------- */
  .stat-top{ display:grid; grid-template-columns:1fr 1.4fr; gap:18px; margin-bottom:22px; }
  .stat{ background:#fff; border-radius:var(--radius); padding:22px 24px; box-shadow:var(--shadow); border:1px solid var(--line); }
  .stat .k{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--inkSoft); }
  .stat .v{ font-family:var(--head); font-weight:800; font-size:46px; margin-top:8px; line-height:1; color:var(--blue); }
  .leader{ display:flex; align-items:center; gap:18px; background:linear-gradient(135deg,#fff 40%,var(--yellowSoft)); border-color:#F0E1A8; }
  .leader .k{ color:var(--yellowDark); }
  .leader .nm{ font-family:var(--head); font-weight:700; font-size:19px; margin-top:5px; line-height:1.25; color:var(--navy); }
  .leader .ps{ font-size:13px; color:var(--inkSoft); margin-top:3px; }

  .panel{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow); margin-bottom:22px; }
  .panel h3{ font-family:var(--head); font-weight:700; font-size:18px; margin:0 0 20px; color:var(--navy); }
  .res-row{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .res-row:last-child{ margin-bottom:0; }
  .res-main{ flex:1; min-width:0; }
  .res-top{ display:flex; justify-content:space-between; gap:12px; font-size:14px; margin-bottom:8px; }
  .res-top b{ font-weight:600; }
  .res-top span{ color:var(--inkSoft); font-weight:600; white-space:nowrap; }
  .bar-track{ background:#E8EEF7; border-radius:999px; height:10px; overflow:hidden; }
  .bar-fill{ background:linear-gradient(90deg,var(--blue),var(--cyan)); height:100%; border-radius:999px; transition:width .6s; }
  .res-row.top .bar-fill{ background:linear-gradient(90deg,#E0A800,var(--yellow)); }

  .search{ margin-bottom:14px; }
  .search input{ padding:11px 14px; font-size:14px; }
  .table-wrap{ border:1px solid var(--line); border-radius:12px; max-height:360px; overflow:auto; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ position:sticky; top:0; padding:11px 16px; background:#F4F7FC; border-bottom:1px solid var(--line); color:var(--inkSoft); font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; text-align:left; }
  td{ padding:11px 16px; border-bottom:1px solid #EDF1F8; }
  tr:last-child td{ border-bottom:none; }
  td.num{ font-weight:700; font-variant-numeric:tabular-nums; color:var(--blue); }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .actions .btn{ width:auto; margin-top:0; }

  @media (max-width:640px){
    .card{ padding:34px 24px 30px; }
    h1{ font-size:24px; }
    .hero{ padding:36px 16px 96px; }
    .hero h1{ font-size:27px; }
    .hero p{ font-size:14.5px; }
    .wrap{ padding:0 16px 120px; }
    .grid{ grid-template-columns:1fr; }
    .av.big{ aspect-ratio:16/12; }
    .stat-top{ grid-template-columns:1fr; }
    .topbar-in{ padding:8px 16px; }
    .logo-sm{ height:38px; }
    .chip i{ display:none; }
    .bar-inner .btn{ padding:13px 20px; }
  }
</style>
</head>

const OPTIONS = CANDIDATES.map(c => c.name);
function empName(tabel){ return EMPLOYEES[String(tabel).trim()] || ""; }
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let state = {
  screen: "entry", tabel: "", selected: null, error: "",
  loading: false, pwInput: "", stats: null, confirming: false, search: "",
};

function setState(patch){ state = { ...state, ...patch }; render(); }
const root = document.getElementById("app");

/* ---------- вспомогательные ---------- */
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function getCand(name){ return CANDIDATES.find(c => c.name === name) || { name, position:"", achievements:[] }; }
function initials(name){
  return String(name).split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join("");
}
function avatar(c, size){
  return `<div class="av ${size}">
    <span class="ini">${esc(initials(c.name))}</span>
    ${c.photo ? `<img src="${esc(c.photo)}" alt="${esc(c.name)}" loading="lazy" />` : ""}
  </div>`;
}
const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const ICON_CHECK_GREEN = `<svg viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const ICON_INFO = `<svg viewBox="0 0 24 24" fill="none" stroke="#B58A0A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`;
const ICON_STAR = `<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.8l2.8 5.7 6.3.9-4.55 4.43 1.07 6.27L12 17.1l-5.62 2.95 1.07-6.27L2.9 9.4l6.3-.9L12 2.8z"/></svg>`;

/* ---------- логика (Firebase) ---------- */
async function checkAndProceed(){
  const t = state.tabel.replace(/\s+/g, "");
  state.tabel = t;
  setState({ error: "" });
  if (!t){ setState({ error: "Введите табельный номер" }); return; }
  if (!empName(t)){ setState({ error: "Табельный номер не найден в списке сотрудников. Проверьте номер и попробуйте снова." }); return; }
  setState({ loading: true });
  try{
    const snap = await getDoc(doc(db, "votes", t));
    setState({ loading: false, screen: snap.exists() ? "already" : "vote" });
  }catch(e){
    setState({ loading: false, error: "Не удалось проверить голос. Проверьте настройки Firebase. (" + (e.code || e.message) + ")" });
  }
}

async function submitVote(){
  if (!state.selected){ setState({ error: "Выберите вариант", confirming:false }); return; }
  setState({ loading: true });
  try{
    await setDoc(doc(db, "votes", state.tabel.trim()), {
      tabel: state.tabel.trim(), name: empName(state.tabel), option: state.selected, time: new Date().toISOString(),
    });
    setState({ loading: false, confirming:false, screen: "thanks" });
  }catch(e){
    setState({ loading: false, confirming:false, error: "Не удалось сохранить голос. Попробуйте ещё раз. (" + (e.code || e.message) + ")" });
  }
}

async function loadStats(){
  setState({ loading: true, error: "" });
  try{
    const snap = await getDocs(collection(db, "votes"));
    const records = [];
    snap.forEach(d => records.push(d.data()));
    const counts = {}; OPTIONS.forEach(o => counts[o] = 0);
    records.forEach(r => counts[r.option] = (counts[r.option] || 0) + 1);
    records.sort((a,b) => a.tabel > b.tabel ? 1 : -1);
    setState({ loading: false, stats: { counts, records, total: records.length }, screen: "hrstats" });
  }catch(e){
    setState({ loading: false, error: "Не удалось загрузить статистику (" + (e.code || e.message) + ")" });
  }
}

async function clearAllVotes(){
  if (!confirm("Удалить ВСЕ голоса безвозвратно? Это нужно перед новым голосованием.")) return;
  setState({ loading: true });
  try{
    const snap = await getDocs(collection(db, "votes"));
    for (const d of snap.docs){ await deleteDoc(doc(db, "votes", d.id)); }
    await loadStats();
  }catch(e){
    setState({ loading: false, error: "Не удалось очистить голоса" });
  }
}

function reset(){
  state = { screen:"entry", tabel:"", selected:null, error:"", loading:false, pwInput:"", stats:null, confirming:false, search:"" };
  render();
}

    <img class="logo-sm" src="${LOGO}" alt="Kazakhmys Coal" />
    ${right || ""}
  </div></header>`;
}
function stage(inner){
  return `<div class="stage">${ARCS}${inner}<div class="foot">ТОО «Kazakhmys Coal»</div></div>`;
}

        <h1>${esc(POLL_TITLE)}</h1>
        <p>${esc(POLL_SUBTITLE)}</p>
      </div>
    </section>

    <main class="wrap up">
      <div class="grid">
        ${CANDIDATES.map((c, i) => `
          <div class="cand ${s.selected === c.name ? "active" : ""}" data-idx="${i}">
            <div class="check">${ICON_CHECK}</div>
            ${avatar(c, "big")}
            <div class="cand-body">
              <h2 class="cand-name">${esc(c.name)}</h2>
              <span class="cand-pos">${esc(c.position)}</span>
              ${c.achievements && c.achievements.length ? `
                <div class="cand-sub">Заслуги</div>
                <ul class="ach">${c.achievements.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
            </div>
          </div>`).join("")}
      </div>
      ${s.error ? `<div class="err" style="text-align:center;margin-top:24px">${esc(s.error)}</div>` : ""}
    </main>

    <div class="bar-fixed">
      <div class="bar-inner">
        <div class="bar-sel">${sel ? `Ваш выбор<b>${esc(sel.name)}</b>` : "Выберите кандидата, нажав на карточку"}</div>
        <button class="btn" id="submitBtn" ${(!sel || s.loading) ? "disabled" : ""}>Подтвердить выбор</button>
      </div>
    </div>

    ${s.confirming && sel ? `
    <div class="overlay" id="overlay">
      <div class="modal">
        ${avatar(sel, "md")}
        <h2>Подтвердите выбор</h2>
        <p>Вы голосуете за</p>
        <p><b style="color:var(--navy);font-family:var(--head);font-size:18px">${esc(sel.name)}</b></p>
        <p style="font-size:13px">После подтверждения изменить голос будет нельзя.</p>
        <div class="row">
          <button class="btn ghost" id="cancelBtn" ${s.loading ? "disabled" : ""}>Отмена</button>
          <button class="btn" id="confirmBtn" ${s.loading ? "disabled" : ""}>${s.loading ? "Отправляем…" : "Подтверждаю"}</button>
        </div>
      </div>
    </div>` : ""}`;
  }
  else if (s.screen === "thanks"){
    const sel = getCand(s.selected);
    html = stage(`
      <div class="card center-card status-card">
        ${avatar(sel, "md")}
        <div class="eyebrow">Готово</div>
        <h1>Спасибо, ваш голос учтён</h1>
        <p class="sub">Вы проголосовали за<br><b style="color:var(--navy);font-family:var(--head);font-size:18px">${esc(sel.name)}</b></p>
        <button class="btn ghost" id="backBtn" style="margin-top:28px">Завершить</button>
      </div>`);
  }
  else if (s.screen === "hrlogin"){
    html = stage(`
      <div class="card center-card">
        <img class="logo-lg" src="${LOGO}" alt="Kazakhmys Coal" />
        <div class="eyebrow">Только для кадровика</div>
        <h1 style="font-size:24px">Вход для просмотра статистики</h1>
        <label class="field">Пароль</label>
        <input id="pwInput" type="password" value="${esc(s.pwInput)}" />
        ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
        <button class="btn" id="loginBtn" ${s.loading ? "disabled" : ""}>${s.loading ? "Загружаем…" : "Войти"}</button>
        <div class="center-text"><span class="link" id="backLink">Назад к голосованию</span></div>
      </div>`);
  }
  else if (s.screen === "hrstats" && s.stats){
    const total = s.stats.total;
    const sorted = [...OPTIONS].sort((a,b) => (s.stats.counts[b]||0) - (s.stats.counts[a]||0));
    const maxCount = Math.max(1, ...Object.values(s.stats.counts));
    const leaderName = total > 0 ? sorted[0] : null;
    const leader = leaderName ? getCand(leaderName) : null;
    const q = s.search.trim().toLowerCase();
    const rows = s.stats.records.filter(r =>
      !q || String(r.tabel).toLowerCase().includes(q) || String(r.option).toLowerCase().includes(q) ||
      (empName(r.tabel) || r.name || "").toLowerCase().includes(q));

    html = `
    ${topbar(`<div class="chip"><span class="dot"></span><b>Кадровик · Статистика</b></div>`)}
    <section class="hero compact">
      ${ARCS}
      <div class="hero-in">
        <div class="eyebrow light">Итоги голосования</div>
        <h1>${esc(POLL_TITLE)}</h1>
      </div>
    </section>

    <main class="wrap up">
      <div class="stat-top">
        <div class="stat">
          <div class="k">Всего голосов</div>
          <div class="v">${total}</div>
        </div>
        <div class="stat leader">
          ${leader ? avatar(leader, "md") : ""}
          <div>
            <div class="k">${leader ? "Лидирует" : "Лидер"}</div>
            ${leader
              ? `<div class="nm">${esc(leader.name)}</div>
                 <div class="ps">${esc(leader.position)} · ${s.stats.counts[leaderName]} гол.</div>`
              : `<div class="ps" style="margin-top:8px">Пока никто не проголосовал</div>`}
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>Результаты</h3>
        ${sorted.map((name, idx) => {
          const c = getCand(name);
          const n = s.stats.counts[name] || 0;
          const pct = total ? Math.round(n / total * 100) : 0;
          return `
          <div class="res-row ${idx === 0 && total > 0 ? "top" : ""}">
            ${avatar(c, "sm")}
            <div class="res-main">
              <div class="res-top"><b>${esc(c.name)}</b><span>${n} · ${pct}%</span></div>
              <div class="bar-track"><div class="bar-fill" style="width:${(n/maxCount)*100}%"></div></div>
            </div>
          </div>`;
        }).join("")}
      </div>

      <div class="panel">
        <h3>Кто как проголосовал</h3>
        <div class="search"><input id="searchInput" type="text" placeholder="Поиск по табельному номеру или ФИО" value="${esc(s.search)}" /></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Таб. №</th><th>ФИО сотрудника</th><th>Проголосовал за</th></tr></thead>
            <tbody>
              ${rows.length === 0
                ? `<tr><td colspan="3" style="color:var(--inkSoft)">${total === 0 ? "Пока никто не проголосовал" : "Ничего не найдено"}</td></tr>`
                : rows.map(r => `<tr><td class="num">${esc(r.tabel)}</td><td>${esc(empName(r.tabel) || r.name || "— нет в списке —")}</td><td>${esc(r.option)}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>

      ${s.error ? `<div class="err" style="margin-bottom:14px">${esc(s.error)}</div>` : ""}
      <div class="actions">
        <button class="btn ghost" id="refreshBtn" ${s.loading ? "disabled" : ""}>Обновить</button>
        <button class="btn ghost danger" id="clearBtn" ${s.loading ? "disabled" : ""}>Очистить все голоса</button>
        <button class="btn ghost" id="exitBtn">Выйти</button>
      </div>
    </main>`;
  }

  root.innerHTML = html;
  attachHandlers();
}

function attachHandlers(){
  const s = state;

  // если фото не загрузилось — остаются инициалы
  document.querySelectorAll(".av img").forEach(img => {
    img.onerror = () => img.remove();
  });

  if (s.screen === "entry"){
    const inp = document.getElementById("tabelInput");
    inp.oninput = e => state.tabel = e.target.value;
    inp.onkeydown = e => { if (e.key === "Enter") checkAndProceed(); };
    document.getElementById("goBtn").onclick = checkAndProceed;
    document.getElementById("hrLink").onclick = () => setState({ screen:"hrlogin", error:"" });
  }
  if (s.screen === "already" || s.screen === "thanks"){
    document.getElementById("backBtn").onclick = reset;
  }
  if (s.screen === "vote"){
    document.querySelectorAll(".cand").forEach(el => {
      el.onclick = () => setState({ selected: CANDIDATES[+el.dataset.idx].name, error:"" });
    });
    document.getElementById("submitBtn").onclick = () => setState({ confirming:true });
    if (s.confirming){
      document.getElementById("cancelBtn").onclick = () => setState({ confirming:false });
      document.getElementById("confirmBtn").onclick = submitVote;
      document.getElementById("overlay").onclick = e => { if (e.target.id === "overlay") setState({ confirming:false }); };
    }
  }
  if (s.screen === "hrlogin"){
    const tryLogin = () => {
      if (state.pwInput === HR_PASSWORD) loadStats(); else setState({ error:"Неверный пароль" });
    };
    const pw = document.getElementById("pwInput");
    pw.oninput = e => state.pwInput = e.target.value;
    pw.onkeydown = e => { if (e.key === "Enter") tryLogin(); };
    document.getElementById("loginBtn").onclick = tryLogin;
    document.getElementById("backLink").onclick = reset;
  }
  if (s.screen === "hrstats"){
    document.getElementById("refreshBtn").onclick = loadStats;
    document.getElementById("clearBtn").onclick = clearAllVotes;
    document.getElementById("exitBtn").onclick = reset;
    const si = document.getElementById("searchInput");
    si.oninput = e => {
      const v = e.target.value, pos = e.target.selectionStart;
      setState({ search: v });
      const n = document.getElementById("searchInput");
      n.focus(); n.setSelectionRange(pos, pos);
    };
  }
}

render();
</script>
</body>
</html>
